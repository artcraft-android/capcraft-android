org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# The Rust library's ABIs. arm64-v8a is the one phones need; build one to save time,
# e.g. `./gradlew assembleRelease -Pcapcraft.abis=arm64-v8a`.
capcraft.abis=arm64-v8a

# The app's version and its version code (before the ABI digit: see app/build.gradle.kts, the build
# checks the two agree). Set both to the release's before tagging it.
capcraft.version=0.0.3-beta
capcraft.versionCode=301
