# Release pipeline: pushing a version tag (v0.0.1-beta, v0.2.0, v1.0.0-rc.1, …) builds the APK (for
# 64-bit ARM phones) signed with the release key and makes it a draft GitHub release named after the
# tag, with an empty "What's Changed" section. Fill that in on GitHub and publish the draft: it
# becomes the latest release (betas too: while the app is in beta, every release is one).
#
# A manual run (Actions › Release › Run workflow) is a dry run: it builds the APK at the version in
# gradle.properties and keeps it as the run's artifact, and releases nothing.
#
# The engine needs two native libraries a phone build cannot fetch from crates.io: FFmpeg, built
# from source by src/scripts/ffmpeg-mobile.sh (cached, keyed by the script and the NDK), and the
# sherpa-onnx runtime, fetched by src/scripts/sherpa-mobile.sh. src/scripts/mobile-env.sh then names
# both for the build.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # never cancel a release halfway; a newer push waits its turn
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # ggml (whisper.cpp) compiles to the portable baseline for the architecture, NEON on ARM, rather
  # than to whatever the build machine has
  GGML_NATIVE: "OFF"
  NDK_VERSION: 29.0.14206865

jobs:
  apk:
    name: APK
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - id: v
        name: Resolve version
        run: |
          listed="$(sed -n 's/^capcraft\.version=//p' src/crates/capcraft-android/android/gradle.properties)"
          if [ "$GITHUB_REF_TYPE" = tag ]; then v="${GITHUB_REF_NAME#v}"; else v="$listed"; fi
          if ! printf '%s' "$v" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'; then
            echo "::error::'$v' is not a version like 1.2.3 or 1.2.3-beta"
            exit 1
          fi
          # the tag must be the version gradle.properties names (F-Droid builds from that file)
          if [ "$v" != "$listed" ]; then
            echo "::error::the tag is v$v but gradle.properties says capcraft.version=$listed: set it (and capcraft.versionCode) before tagging"
            exit 1
          fi
          echo "version=$v" >>"$GITHUB_OUTPUT"
          echo "### v$v (\`${GITHUB_SHA::9}\`)" >>"$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y cmake libclang-dev

      # the Rust release src/rust-toolchain.toml names, with the phone's standard library
      - name: Install Rust
        working-directory: src
        run: |
          rustup toolchain install
          rustup target add aarch64-linux-android

      - name: Install cargo-ndk and the Android NDK
        run: |
          cargo install cargo-ndk --version 4.1.2 --locked
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >>"$GITHUB_ENV"

      # restored and saved as two steps, so the FFmpeg build is kept the moment it finishes,
      # whatever happens to the Rust build after it
      - name: FFmpeg for Android (cached)
        id: ffmpeg
        uses: actions/cache/restore@v5
        with:
          path: src/vendor/ffmpeg/aarch64-linux-android
          key: ffmpeg-aarch64-linux-android-${{ env.NDK_VERSION }}-${{ hashFiles('src/scripts/ffmpeg-mobile.sh', 'src/scripts/ffmpeg-patches/**') }}
      - name: FFmpeg for Android
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        run: src/scripts/ffmpeg-mobile.sh aarch64-linux-android
      - name: FFmpeg for Android (save)
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: src/vendor/ffmpeg/aarch64-linux-android
          key: ${{ steps.ffmpeg.outputs.cache-primary-key }}

      - name: sherpa-onnx for Android
        run: src/scripts/sherpa-mobile.sh aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src
          key: release-android

      - name: Release key
        env:
          KEYSTORE_BASE64: ${{ secrets.CAPCRAFT_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d >"$RUNNER_TEMP/release.p12"
            echo "CAPCRAFT_KEYSTORE=$RUNNER_TEMP/release.p12" >>"$GITHUB_ENV"
          elif [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "::error::No release key: a release is never signed with the debug key"
            exit 1
          else
            echo "::warning::No release key: this dry run is signed with the debug key"
          fi

      - name: Build
        env:
          VERSION: ${{ steps.v.outputs.version }}
          CAPCRAFT_KEYSTORE_PASSWORD: ${{ secrets.CAPCRAFT_KEYSTORE_PASSWORD }}
          CAPCRAFT_KEY_ALIAS: ${{ secrets.CAPCRAFT_KEY_ALIAS }}
          CAPCRAFT_KEY_PASSWORD: ${{ secrets.CAPCRAFT_KEY_PASSWORD }}
        run: |
          cd src
          eval "$(scripts/mobile-env.sh aarch64-linux-android)"
          cd crates/capcraft-android/android
          ./gradlew assembleRelease "-Pcapcraft.abis=arm64-v8a" "-Pcapcraft.version=$VERSION" --no-daemon
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/dist/capcraft-android-$VERSION.apk"

      - name: APK
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)apksigner"
          echo >>"$GITHUB_STEP_SUMMARY"
          for apk in dist/*.apk; do
            certs="$("$apksigner" verify --print-certs "$apk")"
            if [ "$GITHUB_REF_TYPE" = tag ] && grep -q "CN=Android Debug" <<<"$certs"; then
              echo "::error::$apk is signed with the debug key"
              exit 1
            fi
            {
              echo "    $(basename "$apk")"
              grep "certificate SHA-256" <<<"$certs" | sed 's/^/      /'
            } >>"$GITHUB_STEP_SUMMARY"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: release-apk
          path: dist/*
          if-no-files-found: error

      - name: Remove the release key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"

  release:
    name: GitHub Release
    needs: apk
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-apk
          path: dist

      - name: Draft the release
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "$GITHUB_REF_NAME" --notes "## What's Changed" -- dist/*
          echo "Draft **$GITHUB_REF_NAME** is ready: fill in What's Changed and publish it." >>"$GITHUB_STEP_SUMMARY"
